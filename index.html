<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventaire maison</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root{--bg:#f5f3ee;--card:#fff;--fg:#1d2320;--muted:#6a716c;--line:#e0ddd3;--accent:#2f6b4f;--accent-fg:#fff;--warn:#a86a12;--bad:#b4442f}
    @media (prefers-color-scheme: dark){:root{--bg:#14171a;--card:#1d2226;--fg:#eceee9;--muted:#9aa29d;--line:#2d3439;--accent:#7cc39a;--accent-fg:#0f1512;--warn:#e3a94f;--bad:#ea7a68}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
    h1{font-size:22px;margin:4px 0 12px}
    h2{font-size:17px;margin:0 0 8px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .small{font-size:13px;color:var(--muted)}
    input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;width:100%;min-width:0}
    label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
    .btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:9px;padding:10px 14px;cursor:pointer}
    .btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
    .btn.danger{color:var(--bad)}
    #reader{width:100%;border-radius:12px;overflow:hidden}
    #status{min-height:22px;font-weight:600;margin:10px 0}
    .hidden{display:none !important}
    .product{display:flex;gap:12px;align-items:flex-start}
    .product img{width:96px;height:96px;object-fit:contain;border-radius:8px;background:#fff;flex:none}
    .grid{display:grid;gap:10px}
    .item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
    .item:last-child{border-bottom:0}
    .tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line)}
    .tag.warn{color:var(--warn)}
    .tag.bad{color:var(--bad)}
  </style>
</head>
<body>

  <h1>Inventaire maison</h1>

  <!-- Étape 1 : scanner -->
  <section class="card" id="scanSection">
    <h2>1. Scanner un code-barres</h2>
    <div id="reader"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="startBtn">Démarrer la caméra</button>
      <button class="btn" id="stopBtn">Arrêter</button>
    </div>
    <p class="small" style="margin:10px 0 0">Ou saisissez le numéro :</p>
    <div class="row" style="margin-top:6px">
      <input id="manualCode" inputmode="numeric" placeholder="Code-barres (8 à 14 chiffres)" class="grow" style="flex:1">
      <button class="btn" id="manualBtn">Chercher</button>
    </div>
    <div id="status"></div>
  </section>

  <!-- Étape 2a : produit trouvé -->
  <section class="card hidden" id="foundSection">
    <h2>Produit trouvé</h2>
    <div class="product">
      <img id="pImage" alt="">
      <div class="grid" style="flex:1;min-width:0">
        <label>Nom
          <input id="pName">
        </label>
        <label>Marque
          <input id="pBrand">
        </label>
        <span class="small" id="pEan"></span>
      </div>
    </div>
    <div class="grid" style="margin-top:12px">
      <label>Emplacement
        <select id="pLoc">
          <option value="frigo">Frigo</option>
          <option value="congélateur">Congélateur</option>
          <option value="cellier">Cellier</option>
        </select>
      </label>
      <div class="row">
        <label style="flex:1">Quantité <input id="pQty" type="number" min="0" step="any" value="1"></label>
        <label style="flex:1">Unité
          <select id="pUnit"></select>
        </label>
      </div>
      <label>Date de péremption <input id="pExp" type="date"></label>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="pAdd">Ajouter à l'inventaire</button>
      <button class="btn" id="pRescan">Scanner un autre produit</button>
    </div>
  </section>

  <!-- Étape 2b : produit inconnu -->
  <section class="card hidden" id="unknownSection">
    <h2>Produit inconnu</h2>
    <p class="small" style="margin-top:0">Ce code n'est pas dans Open Food Facts. Créez la fiche à la main.</p>
    <div class="grid">
      <label>Code-barres <input id="uEan" inputmode="numeric"></label>
      <label>Nom <input id="uName" placeholder="Ex : Yaourt nature"></label>
      <label>Marque <input id="uBrand"></label>
      <div class="row">
        <label style="flex:1">Quantité <input id="uQty" type="number" min="0" step="any" value="1"></label>
        <label style="flex:1">Unité
          <select id="uUnit"></select>
        </label>
      </div>
      <label>Emplacement
        <select id="uLoc">
          <option value="frigo">Frigo</option>
          <option value="congélateur">Congélateur</option>
          <option value="cellier">Cellier</option>
        </select>
      </label>
      <label>Date de péremption <input id="uExp" type="date"></label>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="uAdd">Ajouter à l'inventaire</button>
      <button class="btn" id="uRescan">Scanner un autre produit</button>
    </div>
  </section>

  <!-- Inventaire -->
  <section class="card" id="invSection">
    <h2>Inventaire (<span id="invCount">0</span>)</h2>
    <div id="inventory"></div>
  </section>

<script>
const KEY='inventaire-maison-v1';
const UNITS=['g','kg','ml','cl','L','portion','pièce','boîte'];
const $=s=>document.getElementById(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let inventory=[];
try{inventory=JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){inventory=[];}
const saveInv=()=>{try{localStorage.setItem(KEY,JSON.stringify(inventory));}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---------- Affichage ---------- */
function setStatus(t){$('status').textContent=t;}
function showOnly(section){
  for(const id of ['foundSection','unknownSection']) $(id).classList.add('hidden');
  if(section) $(section).classList.remove('hidden');
}
function fillUnits(){
  const opts=UNITS.map(u=>`<option>${u}</option>`).join('');
  $('pUnit').innerHTML=opts;$('uUnit').innerHTML=opts;
}
function daysLeft(s){
  const [y,m,d]=s.split('-').map(Number);
  const t=new Date();const today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  return Math.round((new Date(y,m-1,d)-today)/86400000);
}
function renderInventory(){
  $('invCount').textContent=inventory.length;
  const order={'frigo':0,'congélateur':1,'cellier':2};
  const items=[...inventory].sort((a,b)=>((order[a.loc]??9)-(order[b.loc]??9))||((a.exp||'9999')<(b.exp||'9999')?-1:1));
  $('inventory').innerHTML=items.length?items.map(it=>{
    let tag='';
    if(it.exp){const dl=daysLeft(it.exp);
      tag=dl<0?`<span class="tag bad">Périmé depuis ${-dl} j</span>`:dl<=3?`<span class="tag warn">Périme dans ${dl} j</span>`:`<span class="tag">Périme le ${esc(it.exp)}</span>`;}
    return `<div class="item"><div><strong>${esc(it.name)}</strong><div class="small">${esc(it.brand||'')}${it.brand?' · ':''}${esc(it.qty)} ${esc(it.unit)} · ${esc(it.loc)}</div><div style="margin-top:4px">${tag}</div></div><button class="btn danger" data-id="${it.id}">Supprimer</button></div>`;
  }).join(''):'<p class="small">Aucun produit pour l\'instant.</p>';
}
$('inventory').onclick=e=>{
  const b=e.target.closest('[data-id]');if(!b)return;
  inventory=inventory.filter(x=>x.id!==b.dataset.id);saveInv();renderInventory();
};

/* ---------- Open Food Facts ---------- */
// Le champ "fields" limite la réponse. Pas de User-Agent : les navigateurs l'ignorent.
async function fetchProduct(code){
  const url=`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_fr,brands,image_front_small_url,image_front_url,quantity`;
  const r=await fetch(url);
  if(!r.ok) throw new Error('http '+r.status);
  const data=await r.json();
  if(data.status!==1||!data.product) return null;
  const p=data.product;
  return {
    name:p.product_name_fr||p.product_name||'',
    brand:p.brands||'',
    image:p.image_front_small_url||p.image_front_url||'',
    quantity:p.quantity||''
  };
}

/* ---------- Scan ---------- */
let scanner=null;
let scanning=false;
let currentEan='';

function isValidEan(c){return /^\d{8,14}$/.test(c);}

async function startCamera(){
  if(scanning) return;
  if(typeof Html5Qrcode==='undefined'){setStatus('Bibliothèque de scan non chargée. Vérifiez votre connexion ou saisissez le numéro.');return;}
  if(!scanner) scanner=new Html5Qrcode('reader');
  try{
    setStatus('Démarrage de la caméra…');
    await scanner.start(
      {facingMode:'environment'},
      {fps:10,qrbox:{width:260,height:140}},
      onScanSuccess,
      ()=>{} // erreurs de lecture ignorées : elles arrivent à chaque image sans code
    );
    scanning=true;
    setStatus('Présentez le code-barres devant la caméra.');
  }catch(err){
    setStatus('Caméra indisponible. Autorisez-la dans le navigateur, ou saisissez le numéro.');
  }
}
async function stopCamera(){
  if(!scanner||!scanning) return;
  try{await scanner.stop();}catch(e){}
  scanning=false;
}
async function onScanSuccess(text){
  await stopCamera();
  lookup(text);
}

/* ---------- Recherche et affichage du résultat ---------- */
async function lookup(raw){
  const code=String(raw||'').replace(/\D/g,'');
  if(!isValidEan(code)){setStatus('Code invalide : il faut 8 à 14 chiffres.');return;}
  currentEan=code;
  setStatus('Recherche du code '+code+'…');
  showOnly(null);
  let info=null;
  try{info=await fetchProduct(code);}
  catch(e){setStatus('Impossible de joindre Open Food Facts. Vérifiez la connexion, puis réessayez.');return;}
  if(info){
    $('pName').value=info.name;
    $('pBrand').value=info.brand;
    $('pEan').textContent='Code : '+code+(info.quantity?' · '+info.quantity:'');
    if(info.image){$('pImage').src=info.image;$('pImage').style.display='';}
    else{$('pImage').removeAttribute('src');$('pImage').style.display='none';}
    $('pQty').value=1;$('pExp').value='';$('pLoc').value='frigo';
    showOnly('foundSection');
    setStatus('Produit trouvé. Choisissez l\'emplacement et la date.');
  }else{
    $('uEan').value=code;$('uName').value='';$('uBrand').value='';
    $('uQty').value=1;$('uExp').value='';$('uLoc').value='frigo';
    showOnly('unknownSection');
    setStatus('Produit inconnu : créez la fiche à la main.');
  }
}

function addItem(item){
  if(!item.name){setStatus('Indiquez le nom du produit avant d\'ajouter.');return;}
  inventory.push({id:uid(),...item});
  saveInv();renderInventory();
  showOnly(null);
  setStatus('Ajouté à l\'inventaire : '+item.name);
}

/* ---------- Boutons ---------- */
$('startBtn').onclick=startCamera;
$('stopBtn').onclick=stopCamera;
$('manualBtn').onclick=()=>lookup($('manualCode').value);
$('manualCode').onkeydown=e=>{if(e.key==='Enter')lookup($('manualCode').value);};

$('pAdd').onclick=()=>addItem({
  ean:currentEan,
  name:$('pName').value.trim(),
  brand:$('pBrand').value.trim(),
  qty:parseFloat($('pQty').value)||1,
  unit:$('pUnit').value,
  loc:$('pLoc').value,
  exp:$('pExp').value
});
$('uAdd').onclick=()=>addItem({
  ean:$('uEan').value.trim(),
  name:$('uName').value.trim(),
  brand:$('uBrand').value.trim(),
  qty:parseFloat($('uQty').value)||1,
  unit:$('uUnit').value,
  loc:$('uLoc').value,
  exp:$('uExp').value
});
$('pRescan').onclick=()=>{showOnly(null);setStatus('');startCamera();};
$('uRescan').onclick=()=>{showOnly(null);setStatus('');startCamera();};

fillUnits();
renderInventory();
</script>
</body>
</html>
